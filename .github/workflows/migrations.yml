name: Migrations

# Shows which supabase/migrations/*.sql files the live database has not applied yet. It NEVER applies anything on a push.
# Steps for Joel: docs/factory/MIGRATIONS-CI.md

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'lib/migrations-manifest.ts'
      - 'lib/migration-drift.ts'
      - 'scripts/migration-drift.ts'
      - 'scripts/check-migration-*.ts'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'OWNER CLICK ONLY. Set to true to run `supabase db push` against the live database. Leave false to just list.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      # Repo secrets. Both are optional: without them the job only checks the folder and the manifest.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Offline checks: the pure drift rules, and the committed list against the folder. These fail the job.
      - run: pnpm dlx tsx scripts/check-migration-drift.ts
      - run: pnpm dlx tsx scripts/check-migration-manifest.ts

      # Read only. With both secrets this asks Supabase for the applied list (one SELECT) and writes the unapplied
      # migrations to the job summary. Without them it writes a short "skipped" note. Exit code 1 only for a repo
      # problem (duplicate number, badly named file); unapplied migrations are listed, not failed.
      - name: List unapplied migrations (read only)
        run: pnpm dlx tsx scripts/migration-drift.ts

  # ---------------------------------------------------------------------------------------------------
  # OPTIONAL, MANUAL, REQUIRES AN OWNER CLICK. Runs only from the Actions tab > Migrations > Run workflow with
  # "apply" ticked, and only when both secrets exist. A push to main never reaches this job. Back up first: a
  # migration cannot be undone by this workflow.
  # ---------------------------------------------------------------------------------------------------
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
    needs: drift
    runs-on: ubuntu-latest
    environment: production-db   # optional: create this Environment with "Required reviewers" for a second approval click
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop unless the secrets exist
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required. Nothing was applied."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show what would be applied
        run: supabase db push --dry-run
      - name: Apply (owner clicked Run workflow with apply = true)
        run: supabase db push
